
name: SSC GD Daily Paper Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

jobs:
  generate-daily-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check API Secret Configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import os; print('GEMINI_API_KEY:', 'AVAILABLE' if os.getenv('GEMINI_API_KEY') else 'MISSING')"
          python -c "import os; print('FIREBASE_SERVICE_ACCOUNT_JSON:', 'AVAILABLE' if os.getenv('FIREBASE_SERVICE_ACCOUNT_JSON') else 'MISSING')"

      - name: Generate SSC GD Daily Paper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python agent.py
